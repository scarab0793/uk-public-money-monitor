name: Procurement data (Contracts Finder + Find a Tender)
on:
  schedule:
    - cron: '20 5 * * *'      # daily refresh
    - cron: '50 */4 * * *'    # historical backfill until coverage reaches the source floors
  workflow_dispatch:
    inputs:
      mode:
        description: daily or backfill
        default: daily
        type: choice
        options: [daily, backfill]
      budget_minutes:
        description: Backfill time budget
        default: '150'
  push:
    branches: [main]
    paths:
      - 'scripts/import_procurement.py'
      - 'scripts/build_procurement.py'
      - 'scripts/procurement_store.py'
      - '.github/workflows/procurement.yml'
permissions:
  contents: write
concurrency:
  group: procurement-data
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 210
    env:
      GH_TOKEN: ${{ github.token }}
      PROCUREMENT_RAW_STORE: github
      MODE: ${{ inputs.mode || (github.event.schedule == '50 */4 * * *' && 'backfill') || 'daily' }}
      BUDGET: ${{ inputs.budget_minutes || '150' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Offline tests
        run: python -m unittest tests.test_procurement -v
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Import (${{ env.MODE }})
        run: |
          cat > /tmp/checkpoint.sh <<'SH'
          set -x
          git status --short | head -20
          git add data/procurement/import-*.json
          git diff --cached --quiet && exit 0
          git commit -q -m "data: procurement import checkpoint"
          for i in 1 2 3 4; do git pull -q --rebase --autostash -X theirs origin main && git push -q origin HEAD:main && exit 0; sleep $((i*10)); done
          SH
          python -u scripts/import_procurement.py --mode "$MODE" --budget-minutes "$BUDGET" --commit-cmd "bash /tmp/checkpoint.sh"
      - name: Build published database
        run: python -u scripts/build_procurement.py
      - name: Publish
        run: |
          git add -A data/procurement
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -q -m "data: refresh procurement database ($MODE)"
          for i in 1 2 3 4; do git pull -q --rebase --autostash -X theirs origin main && git push -q origin HEAD:main && exit 0; sleep $((i*10)); done
          exit 1
