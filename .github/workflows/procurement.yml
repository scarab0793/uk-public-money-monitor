name: Procurement data (Contracts Finder + Find a Tender)
on:
  schedule:
    - cron: '20 5 * * *'      # daily refresh
    - cron: '50 */4 * * *'    # historical backfill until coverage reaches the source floors
  workflow_dispatch:
    inputs:
      mode:
        description: daily or backfill
        default: daily
        type: choice
        options: [daily, backfill]
      budget_minutes:
        description: Backfill time budget
        default: '150'
  push:
    branches: [main]
    paths:
      - 'scripts/import_procurement.py'
      - 'scripts/build_procurement.py'
      - 'scripts/procurement_store.py'
      - 'scripts/git_publish.sh'
      - '.github/workflows/procurement.yml'
permissions:
  contents: write
concurrency:
  group: procurement-data
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 210
    env:
      GH_TOKEN: ${{ github.token }}
      PROCUREMENT_RAW_STORE: github
      MODE: ${{ inputs.mode || (github.event.schedule == '50 */4 * * *' && 'backfill') || 'daily' }}
      BUDGET: ${{ inputs.budget_minutes || '150' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Offline tests
        run: python -m unittest tests.test_procurement -v
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Import (${{ env.MODE }})
        run: |
          python -u scripts/import_procurement.py --mode "$MODE" --budget-minutes "$BUDGET" --commit-cmd "bash scripts/git_publish.sh 'data: procurement import checkpoint' data/procurement/import-state.json data/procurement/import-log.json"
      - name: Publish import state
        # The published database (data/procurement/notices, suppliers, buyers, summary.json) is built
        # from the raw archive by pages.yml when this workflow completes; only the import state is kept in git.
        run: |
          bash scripts/git_publish.sh "data: procurement import state ($MODE)" data/procurement/import-state.json data/procurement/import-log.json
