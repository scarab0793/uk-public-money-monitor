name: Diagnose ONS connectivity
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/diagnose-ons.yml'
permissions:
  contents: read
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test ONS endpoint connectivity and payload
        run: |
          python - <<'PY'
          import json, urllib.error, urllib.request
          from urllib.parse import urlparse
          base = "https://www.ons.gov.uk/economy/governmentpublicsectorandtaxes/publicsectorfinance/timeseries"
          for code in ("hf6x", "anbv", "anlp"):
              url = f"{base}/{code}/dataset/pusf/data"
              print(f"\nChecking {code}: {url}", flush=True)
              request = urllib.request.Request(url, headers={"User-Agent":"UKPublicMoneyMonitor/0.3", "Accept":"application/json"})
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      body = response.read(1000000)
                      print("HTTP:", response.status, "content-type:", response.headers.get("Content-Type"), "bytes:", len(body))
                      payload = json.loads(body)
                      print("JSON keys:", list(payload)[:20])
                      months = payload.get("months")
                      print("Months:", len(months) if isinstance(months,list) else "missing")
                      if isinstance(months,list) and months:
                          print("First:", str(months[0])[:300])
                          print("Last:", str(months[-1])[:300])
              except Exception as exc:
                  print("ERROR:", type(exc).__name__, str(exc)[:300])
          PY
