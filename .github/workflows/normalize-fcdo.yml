name: Normalize FCDO data
on:
  push:
    paths:
      - 'data/fcdo/**'
      - 'scripts/build_fcdo_normalized.py'
      - '.github/workflows/normalize-fcdo.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fcdo-data
  cancel-in-progress: false
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build_fcdo_normalized.py
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add data/fcdo-normalized
          if ! git diff --cached --quiet; then
            git commit -m "Publish normalized FCDO data"
            for i in 1 2 3 4; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep $((i*10)); done
            exit 1
          fi
