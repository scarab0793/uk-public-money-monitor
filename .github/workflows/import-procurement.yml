name: Import procurement pilot
on:
  push:
    paths:
      - '.github/workflows/import-procurement.yml'
      - 'scripts/import_procurement.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python scripts/import_procurement.py
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add data/procurement
          if ! git diff --cached --quiet; then
            git commit -m "Publish procurement pilot data"
            git push
          fi
