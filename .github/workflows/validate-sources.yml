name: Validate public finance source registry
on:
  push:
    paths:
      - 'data/sources.json'
      - 'scripts/validate_sources.py'
      - '.github/workflows/validate-sources.yml'
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate_sources.py
