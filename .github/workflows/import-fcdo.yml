name: Import FCDO underlying data
on:
  push:
    paths:
      - '.github/workflows/import-fcdo.yml'
      - 'scripts/import_fcdo_underlying.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 pandas odfpy
      - run: python scripts/import_fcdo_underlying.py
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add data/fcdo
          if ! git diff --cached --quiet; then
            git commit -m "Import FCDO source worksheets"
            git push
          fi
