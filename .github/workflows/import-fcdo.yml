name: Import FCDO underlying data
on:
  schedule:
    - cron: '40 6 * * 1'   # weekly check for a new annual release
  push:
    paths:
      - '.github/workflows/import-fcdo.yml'
      - 'scripts/import_fcdo_underlying.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fcdo-data
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 pandas odfpy
      - run: python scripts/import_fcdo_underlying.py
      # Normalise in the same job: a commit pushed with GITHUB_TOKEN does not trigger other workflows.
      - run: python scripts/build_fcdo_normalized.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fcdo data/fcdo-normalized
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh FCDO ODA source and normalized data"
            for i in 1 2 3 4; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep $((i*10)); done
            exit 1
          fi
