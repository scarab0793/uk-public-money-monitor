name: Test ONS ingestion
on:
  push:
    paths:
      - 'scripts/fetch_ons.py'
      - 'tests/test_ons.py'
      - '.github/workflows/test-ons.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
