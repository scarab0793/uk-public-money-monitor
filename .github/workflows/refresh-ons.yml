name: Refresh ONS public finances
on:
  push:
    paths:
      - 'scripts/fetch_ons.py'
      - '.github/workflows/refresh-ons.yml'
  schedule:
    - cron: '35 9 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ons-data-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline ingestion tests
        run: python -m unittest discover -s tests -v
      - name: Download and validate official ONS series
        run: python -u scripts/fetch_ons.py
      - name: Rebuild calendar and fiscal-year summaries
        run: python -u scripts/build_ons_summaries.py
      - name: Check generated dataset
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('data/ons-public-finances.json')
          payload = json.loads(path.read_text())
          assert payload.get('series'), 'No validated series published'
          for code, series in payload['series'].items():
              assert len(series['observations']) >= 12, code
              assert series.get('source', '').startswith('https://'), code
          print('Validated:', ', '.join(payload['series']))
          PY
      - name: Upload diagnostic report if ingestion failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ons-ingestion-diagnostics
          path: data/ons-refresh-report.json
          if-no-files-found: warn
          retention-days: 14
      - name: Commit updated observations and diagnostic report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/ons-refresh-report.json
          if [ -f data/ons-public-finances.json ]; then git add data/ons-public-finances.json; fi
          if [ -f data/ons-calendar-year-summary.json ]; then git add data/ons-calendar-year-summary.json; fi
          if [ -f data/ons-financial-year-summary.json ]; then git add data/ons-financial-year-summary.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh ONS public finances"
            git push
          else
            echo "No dataset changes to commit"
          fi
