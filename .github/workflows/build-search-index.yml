name: Build site-wide search index
on:
  workflow_run:
    workflows:
      - "Procurement data (Contracts Finder + Find a Tender)"
      - "Refresh HMRC receipts and Treasury spending tables"
      - "Import FCDO underlying data"
      - "Import official NISTA major projects"
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'scripts/build_search_index.py'
      - '.github/workflows/build-search-index.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: search-index
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -u scripts/build_search_index.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/search
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -q -m "data: rebuild site-wide search index"
          for i in 1 2 3 4; do git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && exit 0; sleep $((i*10)); done
          exit 1
